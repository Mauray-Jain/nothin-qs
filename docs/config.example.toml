# nothin settings: ~/.config/nothin/config.toml
#
# Every key is optional. This file lists them all with their defaults; copy only
# the ones you want to change. nothin reloads the file as soon as you save it.
# If it has an error, nothin keeps the last good settings and shows the line.

# Schema version. nothin migrates older files; leave it as is.
config_version = 1

[general]
# Shown in the greeting.
name = ""
# Which compositor to talk to: "auto" (detect) or "niri".
compositor = "auto"

[theme]
# Used only for active dots, play, errors and pen ink.
accent = "#d71921"
background = "#000000"

[rail]
# Which screen edge the rail sits on: "left", "right", "top" or "bottom".
position = "left"
# Monitors to show it on, by name (see `niri msg outputs`). Empty means all.
monitors = []
# 24-hour clock. false shows 12-hour with AM/PM.
clock_24h = true

[wallpaper]
# Folder of wallpapers. "~" is your home folder.
dir = "~/Pictures/Wallpapers"
# Image to show: a name in dir, or a full path. Empty shows the newest image in dir.
file = ""
# "dots" (halftone in the theme's colours), "color" (halftone in the image's
# colours), "mono" (greyscale image) or "none" (the image as it is).
effect = "dots"
# Size of one halftone dot cell in pixels, 4 to 64.
dot_size = 17
# Brightness of the halftone, 0 to 100. 50 leaves it as it is.
light = 50
# Per-monitor overrides of file, effect, dot_size and light. Replace the empty
# table with sections like:
#   [wallpaper.monitors."HDMI-A-1"]
#   effect = "color"
monitors = {}

[desktop]
# Monitors to show the desktop widgets on, by name. Empty means all.
monitors = []
# "grid" snaps widgets to a 3×3 grid in the order below; "free" uses positions.
layout = "grid"
# The big dot clock and the greeting under it.
hero_clock = true
greeting = true
# Widgets to show: any of "weather", "calendar", "player", "system".
widgets = ["weather", "calendar", "player", "system"]
# Rows of the system widget: any of "cpu", "memory", "disk", "temperature".
system = ["cpu", "memory", "disk", "temperature"]
# Free layout only: where each widget's top-left corner goes, as [x, y] fractions
# of the screen (0 to 1). Widgets without a position keep their grid spot.
# Example: positions = { weather = [0.7, 0.08], player = [0.7, 0.4] }
positions = {}

[weather]
# A place name ("Pune") or "lat,lon" ("18.52,73.86"). Empty looks up your
# location from your IP address once at start.
location = ""

[launcher]
# Web search for "?query" in the launcher; %s is replaced by the query.
search_url = "https://duckduckgo.com/?q=%s"

[idle]
# What "suspend" means here and in the power menu: "suspend", "hibernate" or
# "suspend-then-hibernate" (the last two need a working hibernate setup).
suspend_mode = "suspend"
# Seconds the screen fades to black before the idle lock; any input cancels.
# 0 locks straight away.
fade = 5

# Seconds without input before each step; 0 turns that step off.
[idle.ac]
lock = 300
screen_off = 600
suspend = 0
# Screen off this long after the screen is locked (by you or by idle).
lock_screen_off = 60

[idle.battery]
lock = 180
screen_off = 300
suspend = 840
lock_screen_off = 60

[display]
# Monitor settings, applied live through niri (the DISPLAY page in the settings
# deck writes these). Anything left out stays as niri has it. Replace the empty
# table with sections like:
#   [display.monitors."eDP-1"]
#   scale = 1.5
#   mode = "2560x1600@165"     # or "1920x1080", or "auto"
#   x = 0                      # position in logical pixels; set x and y together
#   y = 0
#   transform = "normal"       # "90", "180", "270", "flipped", "flipped-90", …
#   vrr = false
#   enabled = true             # false turns the monitor off
monitors = {}

[niri]
# Window and input settings for niri. nothin writes the ones you set (here or
# in the deck's WINDOWS / INPUT pages) to ~/.config/niri/nothin.kdl. They only
# take effect if your ~/.config/niri/config.kdl includes that file, at its end:
#     include "nothin.kdl"
# nothin never edits config.kdl. Every key is unset by default, so nothing of
# your own niri config is overridden until you change it.
# gaps = 16
# border_width = 0              # 0 turns the border off
# focus_ring = true
# focus_ring_width = 4
# corner_radius = 12            # rounded window corners
# keyboard_layout = "us"        # xkb layouts, comma-separated: "us,de"
# repeat_delay = 600            # ms before a held key repeats
# repeat_rate = 25              # repeats per second
# touchpad_tap = true
# touchpad_natural_scroll = true
# touchpad_dwt = true           # disable while typing
# touchpad_speed = 0.0          # -1 to 1
# mouse_speed = 0.0             # -1 to 1
# mouse_accel = "adaptive"      # or "flat"
# mouse_natural_scroll = false
